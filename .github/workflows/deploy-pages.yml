name: Deploy Web to GitHub Pages
run-name: Deploy qq1446039171/nasdk-v4.1 web

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh v4.1 Market Snapshot and Push"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      CONFIG_PATH: Config/settings.json
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      # Pages must be enabled once in repo Settings -> Pages -> Source: GitHub Actions.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/Config
          cp web/index.html _site/index.html
          cp "${CONFIG_PATH}" _site/Config/settings.json
          cp Config/market-snapshot.json _site/Config/market-snapshot.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
