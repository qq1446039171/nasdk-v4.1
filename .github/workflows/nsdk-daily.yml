name: NASDAQ v4.1 Daily Observer
run-name: Send v4.1 daily observation for qq1446039171/nasdk-v4.1

on:
  schedule:
    # cron 只负责“什么时候把 runner 叫醒”，不负责决定该发哪条消息。
    # 该不该发、发的是哪个时间点的消息，由 Config/settings.json 的 nsdk.dailyChecks
    # 决定（当前为北京 11:30 / 13:30）；代码里 isSlotDue 是“到点即补发、不设上限”，
    # 因此只要某次运行落在 [11:30, 13:30) 这个窗口内，就会在 13:00 前发出当天第一条，
    # 而 13:30 那条留给之后的那次运行，不会两条挤在同一次运行里发出去。
    #
    # 为什么要铺这么多次（每 30 分钟一次，共 14 次）：
    # GitHub 官方文档明确说 schedule 在高负载时会被延迟，且
    # "some queued jobs may be dropped"（排队任务可能被直接丢弃）。
    # 本仓库实测：8/10-8/26 每天 8 个触发点活下来 2 次，8/27 起每天只剩 1 次，
    # 且上午那一批（北京 11:00-11:45）整批不再产生运行——所以主因是"丢弃"，
    # 触发点越多、活下来的机会越大。延迟实测 1~2 小时。
    # 结论：只要延迟不超过约 4 小时 55 分，就必然有一次运行落进上面的窗口，
    # 从而在 13:00 前收到当天第一条；只要延迟不超过约 5 小时 25 分，
    # 13:30 那条就一定会由另一次运行单独发出，不会两条挤在一起。
    #
    # 时间对照（UTC = 北京时间 - 8h，工作日）：
    #   00:07/00:37/01:07/01:37/02:07/02:37/03:07/03:37/04:07/04:37/05:07/05:37/06:07/06:37 UTC
    #   = 08:07/08:37/09:07/09:37/10:07/10:37/11:07/11:37/12:07/12:37/13:07/13:37/14:07/14:37 北京时间
    # 分钟固定用 07/37，避开整点与半点这两个高负载点（官方建议 "run at a different time of the hour"）。
    # 注意：改动 nsdk.dailyChecks 后，这里的补偿窗口需要同步调整。
    - cron: "7 0-6 * * 1-5"
    - cron: "37 0-6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsdk-runtime-state
  cancel-in-progress: false

jobs:
  daily-observer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test strategy engine
        run: npm test

      - name: Send due daily observation
        env:
          NSDK_SERVERCHAN_SENDKEY: ${{ secrets.NSDK_SERVERCHAN_SENDKEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: npm --prefix app/nsdk run once -- daily

      - name: Persist daily delivery state
        shell: bash
        run: |
          if git diff --quiet -- app/nsdk/state.json Config/push-log.jsonl Config/market-snapshot.json; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/nsdk/state.json Config/push-log.jsonl Config/market-snapshot.json
          git commit -m "chore(v4.1): persist daily observation [skip ci]"
          git push
