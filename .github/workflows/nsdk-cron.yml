name: NASDAQ v4.1 Month-end Runner
run-name: Run v4.1 month-end signal for qq1446039171/nasdk-v4.1

on:
  schedule:
    # 22:30 UTC 已晚于美股常规收盘。工作日每天检查，但每个完整月份只推送一次。
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force preview/push even if this signal month was already sent"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: nasdk-v41-month-end
  cancel-in-progress: false

jobs:
  month-end:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test strategy engine
        run: npm test

      - name: Calculate signal and send plan
        shell: bash
        env:
          NSDK_SERVERCHAN_SENDKEY: ${{ secrets.NSDK_SERVERCHAN_SENDKEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force || 'false' }}" = "true" ]; then
            npm --prefix app/nsdk run once -- once
          else
            npm --prefix app/nsdk run once -- month-end
          fi

      - name: Persist signal state
        shell: bash
        run: |
          if git diff --quiet -- app/nsdk/state.json Config/push-log.jsonl; then
            echo "No runtime changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/nsdk/state.json Config/push-log.jsonl
          git commit -m "chore(v4.1): persist month-end signal [skip ci]"
          git push
