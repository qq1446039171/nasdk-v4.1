name: Refresh v4.1 Market Snapshot and Push
run-name: Refresh today's v4.1 snapshot and send WeChat message

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsdk-runtime-state
  cancel-in-progress: false

jobs:
  refresh-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh market snapshot and send WeChat message
        id: refresh
        continue-on-error: true
        env:
          NSDK_SERVERCHAN_SENDKEY: ${{ secrets.NSDK_SERVERCHAN_SENDKEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIINGO_API_TOKEN: ${{ secrets.TIINGO_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: npm --prefix app/nsdk run once -- manual-refresh

      - name: Persist refreshed snapshot and push audit
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- app/nsdk/state.json Config/push-log.jsonl Config/market-snapshot.json; then
            echo "No market snapshot changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/nsdk/state.json Config/push-log.jsonl Config/market-snapshot.json
          git commit -m "chore(v4.1): refresh market snapshot"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Upload refreshed snapshot for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-market-snapshot
          path: Config/market-snapshot.json
          retention-days: 7

      - name: Report push failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "The market snapshot was persisted, but the WeChat push failed."
